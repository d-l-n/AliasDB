<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128" fill="none">
  <defs>
    <filter id="real-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.38" />
    </filter>
    <linearGradient id="feather-grad-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="feather-grad-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="feather-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="bill-face-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CD180" />
      <stop offset="25%" stop-color="#60B053" />
      <stop offset="70%" stop-color="#46933A" />
      <stop offset="100%" stop-color="#2D6B23" />
    </linearGradient>
    <linearGradient id="bill-inner-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#418534" />
      <stop offset="50%" stop-color="#6DB860" />
      <stop offset="100%" stop-color="#3C7B30" />
    </linearGradient>
    <linearGradient id="stack-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34682A" />
      <stop offset="35%" stop-color="#234B1B" />
      <stop offset="100%" stop-color="#11250C" />
    </linearGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A8" />
      <stop offset="30%" stop-color="#F5C036" />
      <stop offset="70%" stop-color="#D99714" />
      <stop offset="100%" stop-color="#9E6805" />
    </linearGradient>
  </defs>

  <g filter="url(#real-shadow)">
    <!-- Ala Izquierda Realista -->
    <path d="M 18 28 C 11 15, 3 6, 1 7 C -0.5 9, 1.5 13, 4 16 C 1 18, 0.5 22, 2.5 24.5 C 5.5 26.5, 9.5 27, 13 26 Z" fill="url(#feather-back)" opacity="0.95" />
    <path d="M 20 25 C 13 12, 4 2, 1 4 C -0.5 6, 1.5 10, 4.5 12 C 1.5 14, 0.5 18, 3 20.5 C 6 22.5, 10 23, 13.5 22 C 11 24.5, 10 27.5, 12 29 C 15 30, 18.5 28, 21.5 25.5 Z" fill="url(#feather-grad-l)" stroke="#64748B" stroke-width="0.8" stroke-linejoin="round" />
    <path d="M 3.5 8 C 7.5 12, 13 18, 18 22" stroke="#CBD5E1" stroke-width="0.9" stroke-linecap="round" />
    <path d="M 4.5 17 C 8.5 19, 13 21, 17 23" stroke="#CBD5E1" stroke-width="0.9" stroke-linecap="round" />

    <!-- Ala Derecha Realista -->
    <path d="M 46 28 C 53 15, 61 6, 63 7 C 64.5 9, 62.5 13, 60 16 C 63 18, 63.5 22, 61.5 24.5 C 58.5 26.5, 54.5 27, 51 26 Z" fill="url(#feather-back)" opacity="0.95" />
    <path d="M 44 25 C 51 12, 60 2, 63 4 C 64.5 6, 62.5 10, 59.5 12 C 62.5 14, 63.5 18, 61 20.5 C 58 22.5, 54 23, 50.5 22 C 53 24.5, 54 27.5, 52 29 C 49 30, 45.5 28, 42.5 25.5 Z" fill="url(#feather-grad-r)" stroke="#64748B" stroke-width="0.8" stroke-linejoin="round" />
    <path d="M 60.5 8 C 56.5 12, 51 18, 46 22" stroke="#CBD5E1" stroke-width="0.9" stroke-linecap="round" />
    <path d="M 59.5 17 C 55.5 19, 51 21, 47 23" stroke="#CBD5E1" stroke-width="0.9" stroke-linecap="round" />

    <!-- Grosor del Fajo (Lomo de Papeles Apilados) -->
    <path d="M 8 36 L 8 46 C 8 48.5, 10.5 51, 14 51 L 50 51 C 53.5 51, 56 48.5, 56 46 L 56 36 Z" fill="url(#stack-depth)" stroke="#11250C" stroke-width="0.75" />
    <line x1="8" y1="39.5" x2="56" y2="39.5" stroke="#48813B" stroke-width="0.6" />
    <line x1="8" y1="42.5" x2="56" y2="42.5" stroke="#336628" stroke-width="0.6" />
    <line x1="8" y1="45.5" x2="56" y2="45.5" stroke="#22481A" stroke-width="0.6" />
    <line x1="8" y1="48.5" x2="56" y2="48.5" stroke="#153010" stroke-width="0.6" />

    <!-- Cara Superior del Billete Verde Dólar -->
    <rect x="8" y="24" width="48" height="23" rx="4" fill="url(#bill-face-grad)" stroke="#183B12" stroke-width="1" />
    <rect x="10.5" y="26.5" width="43" height="18" rx="2.5" fill="none" stroke="#265A1E" stroke-width="0.8" stroke-dasharray="1.8 1.2" opacity="0.9" />
    <rect x="12" y="28" width="40" height="15" rx="1.8" fill="url(#bill-inner-grad)" opacity="0.95" />

    <!-- Óvalo de Retrato y Detalles Numéricos -->
    <ellipse cx="32" cy="35.5" rx="7" ry="5.8" fill="#3A752F" stroke="#1A4213" stroke-width="0.8" />
    <ellipse cx="32" cy="35.5" rx="5.5" ry="4.4" fill="#5AA84D" />
    <ellipse cx="32" cy="35.5" rx="3.5" ry="2.8" fill="#24521B" />
    <text x="13.5" y="32" font-family="'JetBrains Mono', Arial, sans-serif" font-weight="900" font-size="4" fill="#14360F">$</text>
    <text x="47.5" y="32" font-family="'JetBrains Mono', Arial, sans-serif" font-weight="900" font-size="4" fill="#14360F">$</text>
    <text x="13.5" y="41.5" font-family="'JetBrains Mono', Arial, sans-serif" font-weight="900" font-size="4" fill="#14360F">$</text>
    <text x="47.5" y="41.5" font-family="'JetBrains Mono', Arial, sans-serif" font-weight="900" font-size="4" fill="#14360F">$</text>

    <!-- Faja Dorada con Sombra y Brillo Especular -->
    <rect x="25.5" y="23.5" width="13.5" height="28" rx="1" fill="#000000" opacity="0.3" />
    <rect x="26" y="23" width="12" height="28.5" rx="1.5" fill="url(#gold-foil)" stroke="#7A5204" stroke-width="0.75" />
    <rect x="28.5" y="23.5" width="2.5" height="27.5" fill="#FFFFFF" opacity="0.4" />
    <line x1="26" y1="35.5" x2="38" y2="35.5" stroke="#9E6805" stroke-width="0.75" opacity="0.6" />
  </g>
</svg>