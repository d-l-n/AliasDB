<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Alias de Amigos // Directorio Bancario</title>
  
  <!-- Modern Color Scheme Declaration -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F5F0" id="meta-theme-color">

  <!-- Anti-FOUC Theme Pre-initialization -->
  <script>
    (function() {
      try {
        var storedTheme = localStorage.getItem('theme-preference');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var activeTheme = storedTheme ? storedTheme : (systemDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', activeTheme);
        var metaScheme = document.querySelector('meta[name="color-scheme"]');
        if (metaScheme) {
          metaScheme.content = activeTheme === 'dark' ? 'dark' : (storedTheme ? 'light' : 'light dark');
        }
        var metaTheme = document.getElementById('meta-theme-color');
        if (metaTheme) {
          metaTheme.content = activeTheme === 'dark' ? '#121214' : '#F7F5F0';
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       NEO-BRUTALIST DESIGN TOKENS & SYSTEM
       ========================================================================== */
    :root {
      /* Declaración nativa de soporte de esquemas */
      color-scheme: light dark;

      /* Modo Claro (Tokens Base) */
      --canvas: #F7F5F0;
      --surface: #FFFFFF;
      --surface-muted: #EDE9DF;
      --surface-elevated: #FFFFFF;
      --text: #0D0D11;
      --text-muted: #4B4B58;
      --border: #0D0D11;
      --shadow: #0D0D11;
      --shadow-subtle: rgba(13, 13, 17, 0.12);

      /* Neo-Brutalist Accent Palette */
      --accent-yellow: #FFE600;
      --accent-cyan: #00F0FF;
      --accent-mint: #2DF8C5;
      --accent-purple: #B57BFF;
      --accent-pink: #FF5EAC;
      --accent-orange: #FF6B00;
      --accent-red: #FF3B30;
      --accent-lime: #CCFF00;
      --accent-blue: #2563EB;

      /* Badges de Bancos de Argentina y Latam (Contraste verificado >= 4.5:1) */
      --bank-mp-bg: #00D1FF;
      --bank-mp-text: #002B36;
      --bank-galicia-bg: #FF7A00;
      --bank-galicia-text: #170700;
      --bank-santander-bg: #D31010;
      --bank-santander-text: #FFFFFF;
      --bank-brubank-bg: #7328E0;
      --bank-brubank-text: #FFFFFF;
      --bank-lemon-bg: #B8FF00;
      --bank-lemon-text: #0A1C00;
      --bank-bbva-bg: #004DB8;
      --bank-bbva-text: #FFFFFF;
      --bank-uala-bg: #D81B60;
      --bank-uala-text: #FFFFFF;
      --bank-generic-bg: #E2E8F0;
      --bank-generic-text: #0F172A;

      /* Geometría Neo-Brutalista y Ergonomía */
      --border-width: 2px;
      --border-thick: 3px;
      --shadow-offset: 4px;
      --shadow-offset-sm: 2px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;
      --touch-min: 44px;

      /* Fuentes */
      --font-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;

      /* Transiciones Táctiles */
      --transition-tap: transform 0.08s cubic-bezier(0, 0, 0.2, 1), box-shadow 0.08s cubic-bezier(0, 0, 0.2, 1);
      --transition-hover: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
    }

    /* Modo Oscuro - Selector explícito y preferencia del sistema */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --canvas: #121214;
        --surface: #1E1E22;
        --surface-muted: #28282E;
        --surface-elevated: #24242A;
        --text: #FFFFFF;
        --text-muted: #A1A1AA;
        --border: #FFFFFF;
        --shadow: #FFFFFF;
        --shadow-subtle: rgba(255, 255, 255, 0.15);

        --bank-generic-bg: #334155;
        --bank-generic-text: #F8FAFC;
      }
    }

    :root[data-theme="dark"] {
      --canvas: #121214;
      --surface: #1E1E22;
      --surface-muted: #28282E;
      --surface-elevated: #24242A;
      --text: #FFFFFF;
      --text-muted: #A1A1AA;
      --border: #FFFFFF;
      --shadow: #FFFFFF;
      --shadow-subtle: rgba(255, 255, 255, 0.15);

      --bank-generic-bg: #334155;
      --bank-generic-text: #F8FAFC;
    }

    /* Modern color-scheme sync with meta tag */
    :root:has(> head > meta[name="color-scheme"][content="dark"]) {
      color-scheme: dark;
    }
    :root:has(> head > meta[name="color-scheme"][content="light"]) {
      color-scheme: light;
    }

    /* ==========================================================================
       CSS RESET & BASE
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--canvas);
      color: var(--text);
      font-family: var(--font-display);
      font-size: 16px;
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: calc(var(--touch-min) + 36px + env(safe-area-inset-bottom, 0px));
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Focus States Accesibles de Alto Contraste */
    :focus-visible {
      outline: 3px solid var(--accent-yellow);
      outline-offset: 3px;
    }

    [data-theme="dark"] :focus-visible {
      outline: 3px solid var(--accent-cyan);
    }

    /* ==========================================================================
       TYPOGRAPHY & UTILITIES
       ========================================================================== */
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    /* ==========================================================================
       LAYOUT & HEADER
       ========================================================================== */
    .app-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .app-container {
        padding: 24px;
        gap: 24px;
      }
    }

    /* Header Neo-Brutalista */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      background: var(--surface);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--shadow);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: var(--accent-yellow);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-offset-sm) var(--shadow-offset-sm) 0px var(--shadow);
      font-weight: 900;
      font-size: 1.25rem;
      color: #0D0D11;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .brand-tagline {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Theme Switch Toggle Button */
    .theme-toggle-btn {
      width: var(--touch-min);
      height: var(--touch-min);
      min-width: var(--touch-min);
      min-height: var(--touch-min);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-muted);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-offset-sm) var(--shadow-offset-sm) 0px var(--shadow);
      cursor: pointer;
      color: var(--text);
      transition: var(--transition-tap);
    }

    .theme-toggle-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--shadow);
    }

    .theme-toggle-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-sun { display: none; }
    .icon-moon { display: block; }
    [data-theme="dark"] .icon-sun { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }

    /* ==========================================================================
       SEARCH & FILTER CONTROLS
       ========================================================================== */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 50px;
      min-height: var(--touch-min);
      padding: 0 44px 0 44px;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      background: var(--surface);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--shadow);
      transition: var(--transition-hover);
    }

    .search-input::placeholder {
      color: var(--text-muted);
      font-weight: 500;
    }

    .search-input:focus {
      outline: none;
      background: var(--surface-elevated);
      transform: translate(-1px, -1px);
      box-shadow: calc(var(--shadow-offset) + 2px) calc(var(--shadow-offset) + 2px) 0px var(--shadow);
    }

    .search-clear-btn {
      position: absolute;
      right: 6px;
      width: 38px;
      height: 38px;
      min-width: 38px;
      min-height: 38px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      place-items: center;
      border-radius: var(--radius-sm);
    }

    .search-clear-btn.visible {
      display: grid;
    }

    /* Horizontal Bank Pills Filter */
    .filter-scroll-container {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin: 0 -16px;
      padding-left: 16px;
      padding-right: 16px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-snap-type: x proximity;
    }

    @media (min-width: 640px) {
      .filter-scroll-container {
        margin: 0;
        padding-left: 0;
        padding-right: 0;
        flex-wrap: wrap;
      }
    }

    .filter-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      height: 38px;
      min-height: 38px;
      padding: 0 14px;
      font-family: var(--font-display);
      font-size: 0.8125rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      background: var(--surface);
      color: var(--text);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-offset-sm) var(--shadow-offset-sm) 0px var(--shadow);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      scroll-snap-align: start;
      transition: var(--transition-tap);
    }

    .filter-chip:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--shadow);
    }

    .filter-chip.active {
      background: var(--accent-yellow);
      color: #0D0D11;
      border-color: var(--border);
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--shadow);
    }

    [data-theme="dark"] .filter-chip.active {
      background: var(--accent-cyan);
      color: #0D0D11;
    }

    /* ==========================================================================
       CARDS GRID & FRIEND CARD COMPONENT
       ========================================================================== */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 700px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }

    /* Friend Card */
    .friend-card {
      background: var(--surface);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--shadow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: var(--transition-hover);
      position: relative;
      overflow: hidden;
    }

    .friend-card:hover {
      transform: translate(-1px, -1px);
      box-shadow: calc(var(--shadow-offset) + 2px) calc(var(--shadow-offset) + 2px) 0px var(--shadow);
    }

    /* Friend Card Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: var(--border-width) dashed var(--border);
    }

    .friend-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .friend-avatar {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-offset-sm) var(--shadow-offset-sm) 0px var(--shadow);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.05rem;
      color: #0D0D11;
      background: var(--accent-cyan);
      flex-shrink: 0;
    }

    .friend-info {
      display: flex;
      flex-direction: column;
    }

    .friend-name {
      font-size: 1.125rem;
      font-weight: 800;
      line-height: 1.2;
      color: var(--text);
    }

    .friend-meta {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Accounts List inside Card */
    .accounts-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .account-item {
      background: var(--surface-muted);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .account-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Bank Badges (Neo-Brutalist High Contrast) */
    .bank-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 2px 2px 0px var(--shadow);
      line-height: 1.2;
    }

    .bank-badge-mp {
      background: var(--bank-mp-bg);
      color: var(--bank-mp-text);
    }

    .bank-badge-galicia {
      background: var(--bank-galicia-bg);
      color: var(--bank-galicia-text);
    }

    .bank-badge-santander {
      background: var(--bank-santander-bg);
      color: var(--bank-santander-text);
    }

    .bank-badge-brubank {
      background: var(--bank-brubank-bg);
      color: var(--bank-brubank-text);
    }

    .bank-badge-lemon {
      background: var(--bank-lemon-bg);
      color: var(--bank-lemon-text);
    }

    .bank-badge-bbva {
      background: var(--bank-bbva-bg);
      color: var(--bank-bbva-text);
    }

    .bank-badge-uala {
      background: var(--bank-uala-bg);
      color: var(--bank-uala-text);
    }

    .bank-badge-generic {
      background: var(--bank-generic-bg);
      color: var(--bank-generic-text);
    }

    .account-type {
      font-size: 0.6875rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ==========================================================================
       1-CLICK COPY ERGONOMICS & INTERACTIVE CHIPS
       ========================================================================== */
    .copy-action-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    /* Alias interactive pill (Touch area 1: Tap the whole chip) */
    .alias-chip {
      flex: 1;
      min-width: 0;
      min-height: var(--touch-min);
      background: var(--surface);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-offset-sm) var(--shadow-offset-sm) 0px var(--shadow);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: var(--transition-tap);
      position: relative;
    }

    .alias-chip:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--shadow);
    }

    .alias-chip:hover {
      background: var(--surface-elevated);
    }

    .alias-text {
      font-family: var(--font-mono);
      font-size: clamp(0.8125rem, 3.6vw, 0.9375rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .alias-sub-hint {
      font-size: 0.6875rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      display: none;
    }

    @media (min-width: 480px) {
      .alias-sub-hint {
        display: inline-block;
      }
    }

    /* Dedicated Copy Action Button (Touch area 2: Dedicated tactile button) */
    .copy-btn {
      width: var(--touch-min);
      height: var(--touch-min);
      min-width: var(--touch-min);
      min-height: var(--touch-min);
      background: var(--accent-yellow);
      color: #0D0D11;
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-offset-sm) var(--shadow-offset-sm) 0px var(--shadow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: var(--transition-tap);
    }

    [data-theme="dark"] .copy-btn {
      background: var(--accent-cyan);
      color: #0D0D11;
    }

    .copy-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--shadow);
    }

    .copy-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Microanimación de éxito en chip copiado */
    @keyframes copyPulse {
      0% { transform: scale(1); }
      40% { transform: scale(0.96) translate(2px, 2px); }
      80% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .alias-chip.copied-active {
      animation: copyPulse 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: var(--accent-mint) !important;
      color: #0D0D11 !important;
    }

    .alias-chip.copied-active .alias-text,
    .alias-chip.copied-active .alias-sub-hint {
      color: #0D0D11 !important;
    }

    .copy-btn.copied-active {
      background: var(--accent-mint) !important;
      color: #0D0D11 !important;
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--shadow);
    }

    /* CBU / Secondary Details Collapsible / Secondary Row */
    .cbu-details-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      background: rgba(0, 0, 0, 0.03);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
    }

    [data-theme="dark"] .cbu-details-row {
      background: rgba(255, 255, 255, 0.05);
    }

    .cbu-number {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .cbu-copy-mini-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      padding: 4px 8px;
      text-decoration: underline;
    }

    .cbu-copy-mini-btn:hover {
      color: var(--text);
    }

    /* ==========================================================================
       EMPTY & LOADING STATES
       ========================================================================== */
    .state-card {
      background: var(--surface);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--shadow);
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .state-icon-box {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      background: var(--accent-yellow);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-offset-sm) var(--shadow-offset-sm) 0px var(--shadow);
      font-size: 2rem;
      color: #0D0D11;
    }

    .state-title {
      font-size: 1.25rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .state-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.4;
    }

    .btn-brutalist {
      height: var(--touch-min);
      min-height: var(--touch-min);
      padding: 0 20px;
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--accent-yellow);
      color: #0D0D11;
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-offset-sm) var(--shadow-offset-sm) 0px var(--shadow);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition-tap);
    }

    .btn-brutalist:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--shadow);
    }

    /* ==========================================================================
       TOAST NOTIFICATION (ACCESSIBLE & POP-UP)
       ========================================================================== */
    .toast-container {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      pointer-events: none;
      width: calc(100% - 32px);
      max-width: 440px;
    }

    .brutalist-toast {
      pointer-events: auto;
      background: var(--accent-mint);
      color: #0D0D11;
      border: var(--border-thick) solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: 6px 6px 0px var(--shadow);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      opacity: 0;
      transform: translateY(24px) scale(0.95);
      transition: opacity 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .brutalist-toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .toast-content {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .toast-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: #0D0D11;
      color: var(--accent-mint);
      border-radius: var(--radius-sm);
    }

    .toast-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 3;
    }

    .toast-close-btn {
      width: 36px;
      height: 36px;
      min-width: 36px;
      min-height: 36px;
      background: transparent;
      border: none;
      color: #0D0D11;
      cursor: pointer;
      display: grid;
      place-items: center;
      border-radius: var(--radius-sm);
      font-weight: 900;
      font-size: 1.1rem;
    }

    /* Accessibility: Reduced Motion Support */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- Screen Reader Live Region for Accessible Announcements -->
  <div id="sr-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="app-container">
    
    <!-- Top Header -->

            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>

    <!-- Search & Bank Filters Controls -->
    <section class="controls-wrapper" aria-label="Controles de b&uacute;squeda y filtros">
      <!-- Search Input -->
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <input

          autocomplete="off"

          aria-label="Buscar por nombre de amigo, alias bancario o entidad"
        >
        <button id="search-clear" class="search-clear-btn" type="button" aria-label="Limpiar b&uacute;squeda">&times;</button>
      </div>

      <!-- Bank Filter Pills (Horizontally Scrollable) -->
      <div class="filter-scroll-container" role="toolbar" aria-label="Filtrar por entidad bancaria">
        <button class="filter-chip active" data-bank="ALL" type="button" aria-pressed="true">Todos</button>
        <button class="filter-chip" data-bank="MERCADO_PAGO" type="button" aria-pressed="false">Mercado Pago</button>
        <button class="filter-chip" data-bank="GALICIA" type="button" aria-pressed="false">Galicia</button>
        <button class="filter-chip" data-bank="SANTANDER" type="button" aria-pressed="false">Santander</button>
        <button class="filter-chip" data-bank="BRUBANK" type="button" aria-pressed="false">Brubank</button>
        <button class="filter-chip" data-bank="LEMON" type="button" aria-pressed="false">Lemon Cash</button>
        <button class="filter-chip" data-bank="BBVA" type="button" aria-pressed="false">BBVA</button>
        <button class="filter-chip" data-bank="UALA" type="button" aria-pressed="false">Ual&aacute;</button>
        <button class="filter-chip" data-bank="OTROS" type="button" aria-pressed="false">Otros</button>
      </div>
    </section>

    <!-- Cards Grid Container -->
    <main id="cards-container" class="cards-grid" aria-label="Listado de alias bancarios de amigos" aria-live="polite">
      <!-- Din&aacute;micamente renderizado por JavaScript -->
    </main>

  </div>

  <!-- Toast Notification (Accessible Bottom Bar) -->
  <div class="toast-container" aria-hidden="true">
    <div id="brutalist-toast" class="brutalist-toast" role="status">
      <div class="toast-content">
        <div class="toast-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <span id="toast-message">Alias copiado al portapapeles</span>
      </div>
      <button id="toast-close" class="toast-close-btn" type="button" aria-label="Cerrar notificaci&oacute;n">&times;</button>
    </div>
  </div>

  <!-- Client-side Logic: Theme, Copy Ergonomics, Filtering & Data Rendering -->
  <script>
    (function() {
      'use strict';

      /* ======================================================================

        {

          accounts: [
            {

            },

          ]

        {

          accounts: [
            {

              alias: 'cami.bbva.cuenta',

            },
            {

              type: 'CVU Prepaga',
              alias: 'camila.uala.amigos',

            }
          ]
        },
        {
          id: '5',
          name: 'Joaqu\u00edn Navarro',
          avatarColor: 'var(--accent-purple)',
          accounts: [
            {
              bankId: 'BRUBANK',
              bankName: 'Brubank',
              badgeClass: 'bank-badge-brubank',
              type: 'Caja Ahorro USD / $',
              alias: 'joaco.brubank.pay',
              cbu: '1430001713009845720182'
            },
            {
              bankId: 'OTROS',
              bankName: 'Banco Naci\u00f3n',
              badgeClass: 'bank-badge-generic',
              type: 'Caja de Ahorro $',
              alias: 'joaco.bna.oficial',
              cbu: '0110599520000012345678'
            }
          ]
        }
      ];

      /* App State */
      var friendsData = DEFAULT_FRIENDS_DATA.slice();
      var activeFilter = 'ALL';
      var searchQuery = '';
      var toastTimeout = null;
      var lastAnnouncedText = '';

      /* ======================================================================
         2. DOM REFERENCES
         ====================================================================== */
      var cardsContainer = document.getElementById('cards-container');
      var searchInput = document.getElementById('search-input');
      var searchClearBtn = document.getElementById('search-clear');
      var filterChips = document.querySelectorAll('.filter-chip');
      var themeToggleBtn = document.getElementById('theme-toggle');
      var metaColorScheme = document.querySelector('meta[name="color-scheme"]');
      var metaThemeColor = document.getElementById('meta-theme-color');
      var srAnnouncer = document.getElementById('sr-announcer');
      var toastEl = document.getElementById('brutalist-toast');
      var toastMessageEl = document.getElementById('toast-message');
      var toastCloseBtn = document.getElementById('toast-close');

      /* ======================================================================
         3. ACCESSIBLE ANNOUNCEMENT & TOAST SYSTEM
         ====================================================================== */
      function announceScreenReader(message) {
        if (!srAnnouncer) return;
        // Anti-skip pattern: if string matches previous announcement, append non-breaking space
        var textToAnnounce = (lastAnnouncedText === message) ? message + '\u00A0' : message;
        lastAnnouncedText = textToAnnounce;
        srAnnouncer.textContent = textToAnnounce;
      }

      function showToast(message, duration) {
        if (!toastEl || !toastMessageEl) return;
        duration = duration || 2800;

        toastMessageEl.textContent = message;
        toastEl.classList.add('show');
        toastEl.parentElement.setAttribute('aria-hidden', 'false');

        announceScreenReader(message);

        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function() {
          hideToast();
        }, duration);
      }

      function hideToast() {
        if (!toastEl) return;
        toastEl.classList.remove('show');
        toastEl.parentElement.setAttribute('aria-hidden', 'true');
        if (toastTimeout) {
          clearTimeout(toastTimeout);
          toastTimeout = null;
        }
      }

      toastCloseBtn.addEventListener('click', hideToast);

      /* ======================================================================
         4. ERGONOMÍA 1-CLICK COPY CON MICROANIMACIÓN FÍSICA
         ====================================================================== */
      function copyToClipboard(text, triggerEl, label) {
        label = label || 'Alias';
        var copied = false;

        function triggerSuccessUI() {
          if (triggerEl) {
            triggerEl.classList.add('copied-active');
            var container = triggerEl.closest('.copy-action-row');
            var siblingBtn = container ? container.querySelector('.copy-btn') : null;
            if (siblingBtn && siblingBtn !== triggerEl) siblingBtn.classList.add('copied-active');

            setTimeout(function() {
              triggerEl.classList.remove('copied-active');
              if (siblingBtn) siblingBtn.classList.remove('copied-active');
            }, 750);
          }
          showToast(label + ' copiado: ' + text);
        }

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(function() {
            triggerSuccessUI();
          }).catch(function() {
            if (fallbackCopy(text)) {
              triggerSuccessUI();
            } else {
              showToast('No se pudo copiar automáticamente');
            }
          });
        } else {
          if (fallbackCopy(text)) {
            triggerSuccessUI();
          } else {
            showToast('No se pudo copiar automáticamente');
          }
        }
      }

      function fallbackCopy(text) {
        try {
          var textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.left = '-9999px';
          textArea.style.top = '0';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          var successful = document.execCommand('copy');
          document.body.removeChild(textArea);
          return successful;
        } catch (err) {
          return false;
        }
      }

      /* ======================================================================
         5. THEME TOGGLING & PERSISTENCIA (ANTI-FOUC COMPLIANT)
         ====================================================================== */
      function toggleTheme() {
        var currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        var newTheme = currentTheme === 'dark' ? 'light' : 'dark';

        document.documentElement.setAttribute('data-theme', newTheme);
        try {
          localStorage.setItem('theme-preference', newTheme);
        } catch (e) {}

        if (metaColorScheme) {
          metaColorScheme.content = newTheme;
        }
        if (metaThemeColor) {
          metaThemeColor.content = newTheme === 'dark' ? '#121214' : '#F7F5F0';
        }

        announceScreenReader('Modo ' + (newTheme === 'dark' ? 'oscuro' : 'claro') + ' activado');
      }

      themeToggleBtn.addEventListener('click', toggleTheme);

      /* ======================================================================
         6. RENDERIZADO MODULAR DE COMPONENTES NEO-BRUTALISTAS
         ====================================================================== */
      function renderCards() {
        var q = searchQuery.toLowerCase().trim();

        var filtered = friendsData.filter(function(friend) {
          var matchesBank = activeFilter === 'ALL' || friend.accounts.some(function(acc) {
            return acc.bankId === activeFilter;
          });

          var matchesQuery = !q || (
            friend.name.toLowerCase().indexOf(q) !== -1 ||
            friend.accounts.some(function(acc) {
              return acc.alias.toLowerCase().indexOf(q) !== -1 || 
                     acc.bankName.toLowerCase().indexOf(q) !== -1 ||
                     acc.cbu.indexOf(q) !== -1;
            })
          );

          return matchesBank && matchesQuery;
        });

        if (filtered.length === 0) {
          cardsContainer.innerHTML = [
            '<div class="state-card" style="grid-column: 1 / -1;">',
            '  <div class="state-icon-box" aria-hidden="true">?</div>',
            '  <h2 class="state-title">Sin coincidencias</h2>',
            '  <p class="state-desc">No encontramos ningún alias para los criterios seleccionados.</p>',
            '  <button id="reset-filters-btn" class="btn-brutalist" type="button">Restablecer búsqueda</button>',
            '</div>'
          ].join('\n');

          var resetBtn = document.getElementById('reset-filters-btn');
          if (resetBtn) {
            resetBtn.addEventListener('click', function() {
              searchInput.value = '';
              searchQuery = '';
              searchClearBtn.classList.remove('visible');
              activeFilter = 'ALL';
              filterChips.forEach(function(chip) {
                var isAll = chip.dataset.bank === 'ALL';
                chip.classList.toggle('active', isAll);
                chip.setAttribute('aria-pressed', isAll.toString());
              });
              renderCards();
              searchInput.focus();
            });
          }
          return;
        }

        cardsContainer.innerHTML = filtered.map(function(friend) {
          var initials = friend.name.split(' ').map(function(n) { return n[0]; }).join('').substring(0, 2).toUpperCase();

          var accountsHtml = friend.accounts
            .filter(function(acc) { return activeFilter === 'ALL' || acc.bankId === activeFilter; })
            .map(function(acc) {
              return [
                '<div class="account-item">',
                '  <div class="account-meta-row">',
                '    <span class="bank-badge ' + acc.badgeClass + '">' + acc.bankName + '</span>',
                '    <span class="account-type">' + acc.type + '</span>',
                '  </div>',
                (acc.titular ? '  <div class="account-titular font-mono" style="font-size: 11px; font-weight: 700; color: var(--text-muted); margin-top: 4px; margin-bottom: 6px;">Titular: ' + acc.titular + '</div>' : ''),
                '  <div class="copy-action-row">',
                '    <div class="alias-chip" role="button" tabindex="0" data-alias="' + acc.alias + '" aria-label="Copiar alias ' + acc.alias + ' de ' + friend.name + '">',
                '      <span class="alias-text font-mono">' + acc.alias + '</span>',
                '      <span class="alias-sub-hint">Tocar p/ copiar</span>',
                '    </div>',
                '    <button class="copy-btn" type="button" data-alias="' + acc.alias + '" aria-label="Copiar alias ' + acc.alias + ' al portapapeles">',
                '      <svg viewBox="0 0 24 24">',
                '        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>',
                '        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
                '      </svg>',
                '    </button>',
                '  </div>',
                '  <div class="cbu-details-row">',
                '    <span class="cbu-number font-mono">CBU: ' + acc.cbu + '</span>',
                '    <button class="cbu-copy-mini-btn" type="button" data-cbu="' + acc.cbu + '" aria-label="Copiar CBU ' + acc.cbu + '">Copiar CBU</button>',
                '  </div>',
                '</div>'
              ].join('\n');
            }).join('\n');

          return [
            '<article class="friend-card" aria-label="Alias bancarios de ' + friend.name + '">',
            '  <div class="card-header">',
            '    <div class="friend-profile">',
            '      <div class="friend-avatar" style="background: ' + friend.avatarColor + ';" aria-hidden="true">' + initials + '</div>',
            '      <div class="friend-info">',
            '        <h2 class="friend-name">' + friend.name + '</h2>',
            '        <span class="friend-meta">' + friend.accounts.length + ' ' + (friend.accounts.length === 1 ? 'cuenta' : 'cuentas') + '</span>',
            '      </div>',
            '    </div>',
            '  </div>',
            '  <div class="accounts-list">',
            accountsHtml,
            '  </div>',
            '</article>'
          ].join('\n');
        }).join('\n');

        attachCardEvents();
      }

      /* Attach Click and Keyboard Events to dynamically created elements */
      function attachCardEvents() {
        cardsContainer.querySelectorAll('.alias-chip').forEach(function(chip) {
          var alias = chip.dataset.alias;
          chip.addEventListener('click', function() {
            copyToClipboard(alias, chip, 'Alias');
          });
          chip.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              copyToClipboard(alias, chip, 'Alias');
            }
          });
        });

        cardsContainer.querySelectorAll('.copy-btn').forEach(function(btn) {
          var alias = btn.dataset.alias;
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            copyToClipboard(alias, btn, 'Alias');
          });
        });

        cardsContainer.querySelectorAll('.cbu-copy-mini-btn').forEach(function(btn) {
          var cbu = btn.dataset.cbu;
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            copyToClipboard(cbu, btn, 'CBU');
          });
        });
      }

      /* ======================================================================
         7. EVENT LISTENERS PARA BÚSQUEDA Y FILTROS
         ====================================================================== */
      searchInput.addEventListener('input', function(e) {
        searchQuery = e.target.value;
        searchClearBtn.classList.toggle('visible', searchQuery.length > 0);
        renderCards();
      });

      searchClearBtn.addEventListener('click', function() {
        searchInput.value = '';
        searchQuery = '';
        searchClearBtn.classList.remove('visible');
        renderCards();
        searchInput.focus();
      });

      filterChips.forEach(function(chip) {
        chip.addEventListener('click', function() {
          filterChips.forEach(function(c) {
            c.classList.remove('active');
            c.setAttribute('aria-pressed', 'false');
          });
          chip.classList.add('active');
          chip.setAttribute('aria-pressed', 'true');
          activeFilter = chip.dataset.bank;
          renderCards();
        });
      });

      /* ======================================================================
         8. INTEGRACIÓN BIDIRECCIONAL CON GOOGLE APPS SCRIPT
         ====================================================================== */
      var AVATAR_PALETTE = [
        'var(--accent-cyan)',
        'var(--accent-yellow)',
        'var(--accent-mint)',
        'var(--accent-purple)',
        'var(--accent-pink)',
        'var(--accent-orange)',
        'var(--accent-lime)'
      ];

      function resolveBankMeta(bankName) {
        var str = (bankName || '').toUpperCase();
        if (str.indexOf('MERCADO') !== -1 || str.indexOf('MP') !== -1) {
          return { bankId: 'MERCADO_PAGO', badgeClass: 'bank-badge-mp' };
        }
        if (str.indexOf('GALICIA') !== -1) {
          return { bankId: 'GALICIA', badgeClass: 'bank-badge-galicia' };
        }
        if (str.indexOf('SANTANDER') !== -1) {
          return { bankId: 'SANTANDER', badgeClass: 'bank-badge-santander' };
        }
        if (str.indexOf('BRUBANK') !== -1) {
          return { bankId: 'BRUBANK', badgeClass: 'bank-badge-brubank' };
        }
        if (str.indexOf('LEMON') !== -1) {
          return { bankId: 'LEMON', badgeClass: 'bank-badge-lemon' };
        }
        if (str.indexOf('BBVA') !== -1 || str.indexOf('FRANCES') !== -1) {
          return { bankId: 'BBVA', badgeClass: 'bank-badge-bbva' };
        }
        if (str.indexOf('UALA') !== -1 || str.indexOf('UALÁ') !== -1) {
          return { bankId: 'UALA', badgeClass: 'bank-badge-uala' };
        }
        return { bankId: 'OTROS', badgeClass: 'bank-badge-generic' };
      }

      function normalizeFriendData(list) {
        if (!Array.isArray(list)) return [];
        return list.map(function(friend, idx) {
          var accounts = (friend.accounts || []).map(function(acc) {
            var bankName = acc.bankName || acc.bank || 'Banco';
            var meta = resolveBankMeta(bankName);
            return {
              id: acc.id || '',
              bankId: acc.bankId || meta.bankId,
              bankName: bankName,
              badgeClass: acc.badgeClass || meta.badgeClass,
              type: acc.type || 'Cuenta',
              alias: acc.alias || '',
              cbu: acc.cbu || '',
              titular: acc.titular || ''
            };
          });

          return {
            id: friend.id || ('friend_' + idx),
            name: friend.name || 'Sin Nombre',
            group: friend.group || 'General',
            avatarColor: friend.avatarColor || AVATAR_PALETTE[idx % AVATAR_PALETTE.length],
            accounts: accounts
          };
        });
      }

      var BACKEND_API_URL = 'https://script.google.com/macros/s/AKfycbz7Pp_RisFpuIFiAycBSL4EJXpydQZRfToR7T-Wd7-Hoaio1n2A4KzUm4d8WAEKVtqeQg/exec';

      function updateSyncStatus(isLive, label) {
        var el = document.getElementById('sync-status');
        if (!el) return;
        if (isLive) {
          el.textContent = '● ' + (label || 'En línea');
          el.style.background = 'var(--accent-mint)';
          el.style.color = '#0D0D11';
        } else {
          el.textContent = '● ' + (label || 'Modo Demo');
          el.style.background = 'var(--surface-muted)';
          el.style.color = 'var(--text-muted)';
        }
      }

      function handleReceivedData(serverData, sourceLabel) {
        var list = null;
        if (Array.isArray(serverData)) {
          list = serverData;
        } else if (serverData && serverData.success && Array.isArray(serverData.data)) {
          list = serverData.data;
        }
        if (list && list.length > 0) {
          friendsData = normalizeFriendData(list);
          updateSyncStatus(true, sourceLabel || 'Sincronizado');
          renderCards();
        } else {
          updateSyncStatus(false, 'Modo Demo');
          renderCards();
        }
      }

      function loadData() {
        // 1. Si se ejecuta dentro del contenedor de Google Apps Script
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function(serverData) {
              handleReceivedData(serverData, 'Apps Script');
            })
            .withFailureHandler(function(err) {
              console.warn('Apps Script backend fallback:', err);
              updateSyncStatus(false, 'Modo Demo');
              renderCards();
            })
            .getFriendsData();
          return;
        }

        // 2. Si se ejecuta en GitHub Pages u host web independiente: consumir API REST
        if (BACKEND_API_URL) {
          fetch(BACKEND_API_URL + '?action=getFriends')
            .then(function(response) {
              if (!response.ok) throw new Error('HTTP ' + response.status);
              return response.json();
            })
            .then(function(serverData) {
              handleReceivedData(serverData, 'En línea');
            })
            .catch(function(err) {
              console.warn('Fetch fallback to default demo data:', err);
              updateSyncStatus(false, 'Modo Demo');
              renderCards();
            });
          return;
        }

        // 3. Fallback local
        updateSyncStatus(false, 'Modo Demo');
        renderCards();
      }

      // Initial Execution
      loadData();

    })();
  </script>
</body>
